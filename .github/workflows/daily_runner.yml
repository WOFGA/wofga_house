name: Tainan Real Estate AI Daily Runner & Bob Quality Gate

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: pip install pandas requests google-genai beautifulsoup4

      - name: 執行實價登錄與 591 在售案件 AI 代理管道
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_agent.py
          python fetch_591_listings.py

      - name: 🧸 Bob 品質巡檢 (執行全平台與 UI 完整性自動化測試)
        run: |
          python test_platform_integrity.py

      - name: 自動將更新後的 listings.json 與 listings_onsale.json 推回網頁
        run: |
          git config --global user.name "Gemini AI Agent"
          git config --global user.email "agent@wofga-house.ai"
          git add listings.json listings_onsale.json
          git diff --staged --quiet || (git commit -m "🤖 AI Agent: 自動更新今日台南房產實登與591在售數據 (經 Bob 巡檢通過)" && git push)
